<style>
/* Layout: a fixed 1920×1080 slide stage scaled into a dark projector frame; a control bar and optional speaker-notes drawer below.
   Deliberately single-theme (a light slide on a dark surround), like a projected deck. */
:root{
  --frame:#0d1219; --bar:#151c26; --bartext:#c9d3e0;
  --bg:#f3f5f8; --panel:#ffffff; --ink:#14202e; --muted:#566273; --line:#d5dbe3; --grid:#e7ebf0; --chip:#e6ecfa;
  --accent:#2c52c9; --amber:#c76f17; --good:#1d7f53; --bad:#c03a12;
  --dark:#13202e; --darktext:#e9eef5; --darkmuted:#9fb0c4;
  --ade:#d0701a; --chi:#8a3fb0; --gen:#13827f;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--frame); color:var(--ink); font-family:var(--f-body); overflow:hidden}
#viewport{position:fixed; left:0; right:0; top:env(safe-area-inset-top,0px); bottom:calc(56px + env(safe-area-inset-bottom,0px)); overflow:hidden}
body.notes #viewport{bottom:calc(196px + env(safe-area-inset-bottom,0px))}
#stage{position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; background:var(--bg); box-shadow:0 10px 60px rgba(0,0,0,.45); overflow:hidden}
.slide{position:absolute; inset:0; padding:84px 96px 64px; display:flex; flex-direction:column; gap:26px; background:var(--bg)}
.slide.dark{background:var(--dark); color:var(--darktext)}
.eyebrow{font-family:var(--f-mono); font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0}
.dark .eyebrow{color:#8fb0ff}
h1,h2,h3{font-family:var(--f-display); margin:0; letter-spacing:-.015em; text-wrap:balance}
h2{font-size:60px; font-weight:700; line-height:1.08}
.head{display:flex; flex-direction:column; gap:10px}
.body{display:grid; grid-template-columns:1060px 1fr; gap:56px; flex:1; min-height:0}
.side{display:flex; flex-direction:column; gap:20px; min-width:0}
.side h4{font-family:var(--f-body); font-size:19px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:0 0 4px}
.side p{margin:0; font-size:25px; line-height:1.4}
.watch{background:var(--chip); border-radius:12px; padding:16px 20px; font-size:24px; line-height:1.4}
.watch b{color:var(--bad)}
pre.code{margin:0; background:var(--dark); color:#dfe7f2; font-family:var(--f-mono); font-size:19px; line-height:1.55; padding:18px 22px; border-radius:12px; white-space:pre-wrap; word-break:break-word}
.chartcol{display:flex; flex-direction:column; gap:18px; min-width:0}
canvas.ch{display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px}
.ctrls{display:flex; flex-wrap:wrap; gap:14px 28px; align-items:center; font-size:22px}
.ctrls .lbl{font-size:18px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.seg{display:inline-flex; border:2px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel)}
.seg button{font:inherit; font-size:21px; padding:8px 16px; border:0; border-right:2px solid var(--line); background:none; color:var(--ink); cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff; font-weight:600}
.chk{display:inline-flex; align-items:center; gap:10px; cursor:pointer; font-size:22px}
.chk input{width:24px; height:24px; accent-color:var(--accent); margin:0}
.rng{display:inline-flex; align-items:center; gap:12px}
.rng input{width:260px; accent-color:var(--accent)}
.rng output{font-family:var(--f-mono); font-size:22px; min-width:40px}
.btn{font:inherit; font-size:22px; font-weight:600; padding:10px 20px; border-radius:10px; border:2px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer}
.btn.ghost{background:var(--panel); color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber); outline-offset:2px}
select{font:inherit; font-size:22px; padding:8px 10px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); max-width:100%}
table.t{border-collapse:collapse; font-size:23px; width:100%}
table.t th,table.t td{padding:10px 14px; border-bottom:1px solid var(--grid); text-align:left}
table.t th{font-size:18px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
table.t td.n{font-family:var(--f-mono); text-align:right}
.badge{display:inline-block; font-size:17px; font-weight:600; padding:3px 10px; border-radius:999px; letter-spacing:.03em}
.b-num{background:#e1e9fb; color:#2441a3} .b-cat{background:#f8e7d4; color:#8a4a0c} .b-time{background:#dcefe6; color:#17603f}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px 28px; display:flex; flex-direction:column; gap:10px}
.card h3{font-size:32px}
.card p{margin:0; font-size:24px; line-height:1.4; color:var(--muted)}
.big{font-family:var(--f-display); font-weight:700}
.mapgrid{display:grid; grid-template-columns:640px 1fr; gap:48px; flex:1; min-height:0}
.maplist{display:flex; flex-direction:column; gap:8px}
.maplist button{all:unset; cursor:pointer; display:grid; grid-template-columns:1fr 250px; gap:16px; align-items:center; padding:13px 18px; border-radius:12px; background:var(--panel); border:2px solid var(--line); font-size:23px}
.maplist button span.r{font-family:var(--f-mono); font-size:19px; color:var(--muted)}
.maplist button[aria-pressed="true"]{border-color:var(--accent); background:var(--chip)}
.maplist button[aria-pressed="true"] span.r{color:var(--accent); font-weight:600}
.maplist button:focus-visible{outline:3px solid var(--amber)}
.promptbox{background:var(--dark); color:#e3eaf4; font-family:var(--f-mono); font-size:21px; line-height:1.55; border-radius:14px; padding:24px 28px; white-space:pre-wrap; min-height:200px}
.meter{display:flex; gap:8px; align-items:center; font-size:22px}
.meter i{display:inline-block; width:42px; height:12px; border-radius:6px; background:var(--line)}
.meter i.on{background:var(--good)}
.prow{display:grid; grid-template-columns:44px 210px 1fr; gap:14px; align-items:center; font-size:22px}
.prow .lab{font-weight:600}
.checklist{display:grid; grid-template-columns:1fr 1fr; gap:16px 48px}
.checklist label{display:grid; grid-template-columns:34px 1fr; gap:14px; align-items:start; font-size:26px; line-height:1.35; cursor:pointer; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 22px}
.checklist input{width:28px; height:28px; accent-color:var(--good); margin:3px 0 0}
.checklist small{display:block; font-size:21px; color:var(--muted); margin-top:4px}
.ex{display:grid; grid-template-columns:repeat(3,1fr); gap:28px; flex:1}
.ex .card{justify-content:space-between}
.ex .ans{font-size:23px; line-height:1.4; color:var(--ink); border-top:1px solid var(--line); padding-top:14px}
.ex .ans b{color:var(--accent)}
.core10{display:grid; grid-template-columns:repeat(5,1fr); gap:18px}
.core10 button{all:unset; cursor:pointer; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:6px}
.core10 button b{font-family:var(--f-display); font-size:28px}
.core10 button span{font-size:20px; color:var(--muted)}
.core10 button:focus-visible{outline:3px solid var(--amber)}
/* bottom bar */
#bar{position:fixed; left:0; right:0; bottom:0; height:calc(56px + env(safe-area-inset-bottom,0px)); padding:0 16px env(safe-area-inset-bottom,0px); background:var(--bar); color:var(--bartext); display:flex; align-items:center; gap:12px; font:500 14px var(--f-body)}
#bar button{font:inherit; color:var(--bartext); background:transparent; border:1px solid #2f3b4c; border-radius:6px; padding:6px 12px; cursor:pointer}
#bar button:hover{border-color:#6f8cd6}
#bar button:disabled{opacity:.35; cursor:default}
#bar .sec{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#8ea0b6}
#bar .num{font-family:var(--f-mono); white-space:nowrap}
#prog{position:fixed; left:0; bottom:calc(56px + env(safe-area-inset-bottom,0px)); height:3px; background:#6f8cd6; transition:width .2s}
#notes{position:fixed; left:0; right:0; bottom:calc(56px + env(safe-area-inset-bottom,0px)); height:140px; background:#111821; color:#d6dfeb; border-top:1px solid #263142; padding:14px 20px; font-size:15px; line-height:1.55; overflow-y:auto}
#notes b{color:#8fb0ff; font-weight:600; font-size:12px; letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:4px}
#bar .decks{display:inline-flex; border:1px solid #2f3b4c; border-radius:7px; overflow:hidden}
#bar .decks button{border:0; border-radius:0; border-right:1px solid #2f3b4c; padding:6px 12px; white-space:nowrap}
#bar .decks button:last-child{border-right:0}
#bar .decks button[aria-selected="true"]{background:#2c52c9; color:#fff}
.fam6{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; flex:1}
.fam6 button{all:unset; cursor:pointer; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px 28px; display:flex; flex-direction:column; gap:10px}
.fam6 button:hover{border-color:var(--accent)}
.fam6 button:focus-visible{outline:3px solid var(--amber)}
.fam6 .k{font-family:var(--f-mono); font-size:20px; color:var(--accent)}
.fam6 b{font-family:var(--f-display); font-size:36px; line-height:1.1}
.fam6 .q{font-size:26px; line-height:1.35}
.fam6 .w{font-family:var(--f-mono); font-size:18px; color:var(--muted); line-height:1.5; margin-top:auto}
.qlist{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px}
.qlist li{font-size:25px; line-height:1.35; padding-left:22px; border-left:4px solid var(--line)}
.qlist li.this{border-left-color:var(--accent)}
.qlist li small{display:block; font-size:19px; color:var(--accent); font-weight:600; margin-top:2px}
.words{font-family:var(--f-mono); font-size:21px; color:var(--ink); line-height:1.5}
.sorter{display:grid; grid-template-columns:1fr 520px; gap:48px; flex:1; min-height:0}
.sq{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:40px 44px; display:flex; flex-direction:column; gap:28px}
.sq .qtext{font-family:var(--f-display); font-size:46px; font-weight:700; line-height:1.18; margin:0}
.sbtns{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.sbtns button{font:inherit; font-size:23px; font-weight:600; padding:16px 12px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer}
.sbtns button.right{border-color:var(--good); background:#dff1e7}
.sbtns button.wrong{border-color:var(--bad); background:#fbe5dc}
.sbtns button:disabled{cursor:default}
.sfeed{font-size:25px; line-height:1.4; min-height:110px; margin:0}
.steps4{display:grid; grid-template-columns:repeat(4,1fr); gap:0; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--panel)}
.steps4 div{padding:14px 20px; border-right:1px solid var(--line); font-size:21px; line-height:1.35}
.steps4 div:last-child{border-right:0}
.steps4 b{display:block; font-family:var(--f-display); font-size:25px}
.steps4 div.on{background:var(--chip)}
@media (max-width:640px){#bar .sec{display:none} #bar .hide-sm{display:none} #bar .decks button{padding:6px 8px}}
@media (prefers-reduced-motion:no-preference){.slide.enter{animation:fadein .28s ease-out}@keyframes fadein{from{opacity:.4}to{opacity:1}}}
</style>

<div id="viewport"><div id="stage"></div></div>

  <button id="b-notes" class="hide-sm" aria-pressed="false">Speaker notes</button>
  <button id="b-full" class="hide-sm">Full screen</button>
</div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
/* ---------- palette & helpers ---------- */
const C={ink:'#14202e',muted:'#566273',line:'#d5dbe3',grid:'#e7ebf0',panel:'#ffffff',accent:'#2c52c9',amber:'#c76f17',bad:'#c03a12',good:'#1d7f53',dark:'#13202e',sp:['#d0701a','#8a3fb0','#13827f']};
const FM='500 18px "IBM Plex Mono", ui-monospace, monospace',FS='500 20px "IBM Plex Sans", system-ui, sans-serif',FB='600 21px "IBM Plex Sans", system-ui, sans-serif',FT='700 27px "Bricolage Grotesque", system-ui, sans-serif';
const lin=(d0,d1,r0,r1)=>v=>r0+(v-d0)/(d1-d0)*(r1-r0);
function ticks(a,b,n=5){const st0=(b-a)/n;const mag=10**Math.floor(Math.log10(st0));const e=st0/mag;const st=mag*(e>=7.5?10:e>=3.5?5:e>=1.5?2:1);const t=[];for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)t.push(+v.toFixed(10));return t;}
const fmt=(v,d=0)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function normal(r){return()=>{let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());};}
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1));};
function ols(x,y){const n=x.length,mx=mean(x),my=mean(y);let sxx=0,syy=0,sxy=0;for(let i=0;i<n;i++){const dx=x[i]-mx,dy=y[i]-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;}const b=sxy/sxx;return{b,a:my-b*mx,r:sxy/Math.sqrt(sxx*syy)};}
function kde(a,bw,xs){const k=1/(a.length*bw*Math.sqrt(2*Math.PI));return xs.map(x=>{let s=0;for(const v of a){const z=(x-v)/bw;s+=Math.exp(-.5*z*z);}return s*k;});}
const scott=a=>sd(a)*Math.pow(a.length,-.2);
const quant=(arr,p)=>{const s=[...arr].sort((a,b)=>a-b);const i=(s.length-1)*p,lo=Math.floor(i);return s[lo]+(s[Math.ceil(i)]-s[lo])*(i-lo);};
const range=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
function hist(a,edges){const c=new Array(edges.length-1).fill(0);const lo=edges[0],w=edges[1]-edges[0];a.forEach(v=>{let i=Math.floor((v-lo)/w);if(i===c.length)i--;if(i>=0&&i<c.length)c[i]++;});return c;}
function axes(ctx,f,o){ctx.save();ctx.font=FM;ctx.lineWidth=1;ctx.strokeStyle=C.grid;ctx.fillStyle=C.muted;ctx.textAlign='right';ctx.textBaseline='middle';
 for(const v of (o.yt||[])){const y=Math.round(o.y(v))+.5;if(y<f.t-1||y>f.b+1)continue;ctx.beginPath();ctx.moveTo(f.l,y);ctx.lineTo(f.r,y);ctx.stroke();ctx.fillText(o.yf?o.yf(v):fmt(v),f.l-8,y);}
 ctx.textAlign='center';ctx.textBaseline='top';for(const v of (o.xt||[])){const x=o.x(v);if(x<f.l-1||x>f.r+1)continue;if(o.xgrid){ctx.beginPath();ctx.moveTo(Math.round(x)+.5,f.t);ctx.lineTo(Math.round(x)+.5,f.b);ctx.stroke();}ctx.fillText(o.xf?o.xf(v):fmt(v),x,f.b+8);}
 ctx.strokeStyle='#9aa6b5';ctx.beginPath();ctx.moveTo(f.l,Math.round(f.b)+.5);ctx.lineTo(f.r,Math.round(f.b)+.5);ctx.stroke();
 ctx.font=FS;ctx.fillStyle=C.muted;if(o.xl){ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText(o.xl,f.r,f.b+34);}if(o.yl){ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillText(o.yl,f.l,f.t-12);}ctx.restore();}
function txt(ctx,t,x,y,o={}){ctx.save();ctx.font=o.font||FB;ctx.fillStyle=o.color||C.ink;ctx.textAlign=o.align||'left';ctx.textBaseline=o.base||'alphabetic';ctx.fillText(t,x,y);ctx.restore();}
function legend(ctx,items,x,y){ctx.save();ctx.font=FS;ctx.textBaseline='middle';let lx=x;for(const[n,c]of items){ctx.fillStyle=c;ctx.beginPath();ctx.arc(lx+7,y,7,0,7);ctx.fill();ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.fillText(n,lx+20,y);lx+=ctx.measureText(n).width+50;}ctx.restore();}
function boxStats(a){const q1=quant(a,.25),md=quant(a,.5),q3=quant(a,.75),iq=q3-q1;const s=[...a].sort((x,y)=>x-y);return{q1,md,q3,lo:s.find(v=>v>=q1-1.5*iq),hi:[...s].reverse().find(v=>v<=q3+1.5*iq)};}
function box(ctx,cx,bw,Y,a,col,alpha=.35){const b=boxStats(a);ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,Y(b.lo));ctx.lineTo(cx,Y(b.q1));ctx.moveTo(cx,Y(b.q3));ctx.lineTo(cx,Y(b.hi));ctx.moveTo(cx-bw/4,Y(b.lo));ctx.lineTo(cx+bw/4,Y(b.lo));ctx.moveTo(cx-bw/4,Y(b.hi));ctx.lineTo(cx+bw/4,Y(b.hi));ctx.stroke();
 ctx.fillStyle=col;ctx.globalAlpha=alpha;ctx.fillRect(cx-bw/2,Y(b.q3),bw,Y(b.q1)-Y(b.q3));ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.strokeRect(cx-bw/2,Y(b.q3),bw,Y(b.q1)-Y(b.q3));ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx-bw/2,Y(b.md));ctx.lineTo(cx+bw/2,Y(b.md));ctx.stroke();ctx.restore();}
function violin(ctx,cx,mw,Y,a,col){const bw=scott(a);const ys=range(Math.min(...a)-1.5*bw,Math.max(...a)+1.5*bw,100),k=kde(a,bw,ys),m=Math.max(...k);ctx.save();ctx.fillStyle=col;ctx.globalAlpha=.35;ctx.beginPath();ys.forEach((y,i)=>{const x=cx+k[i]/m*mw;i?ctx.lineTo(x,Y(y)):ctx.moveTo(x,Y(y));});for(let i=ys.length-1;i>=0;i--)ctx.lineTo(cx-k[i]/m*mw,Y(ys[i]));ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();const b=boxStats(a);ctx.fillStyle=C.ink;ctx.fillRect(cx-5,Y(b.q3),10,Y(b.q1)-Y(b.q3));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,Y(b.md),5,0,7);ctx.fill();ctx.restore();}
function pie(ctx,cx,cy,r,vals,cols,labels){const tot=vals.reduce((a,b)=>a+b,0);let a0=-Math.PI/2;vals.forEach((v,i)=>{if(!v)return;const a1=a0+v/tot*2*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();ctx.fillStyle=cols[i];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();if(labels&&v/tot>.08){const am=(a0+a1)/2;txt(ctx,Math.round(v/tot*100)+'%',cx+Math.cos(am)*r*.62,cy+Math.sin(am)*r*.62,{color:'#fff',align:'center',base:'middle'});}a0=a1;});}

/* ---------- data ---------- */

function hexb(ctx,f,xs,ys,X,Y,R,colr){const S3=Math.sqrt(3),map=new Map();let mx=0;for(let i=0;i<xs.length;i++){const px=X(xs[i])-f.l,py=Y(ys[i])-f.t;const q=(S3/3*px-py/3)/R,r=(2/3*py)/R,x=q,z=r,y=-x-z;let rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);const dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);if(dx>dy&&dx>dz)rx=-ry-rz;else if(dy<=dz)rz=-rx-ry;const key=rx+','+rz;const v=(map.get(key)||0)+1;map.set(key,v);if(v>mx)mx=v;}

{id:'l2-cover',deck:1,dark:true,sec:'Chart families',html:`<div style="display:flex;flex-direction:column;gap:34px;flex:1;justify-content:center"><p class="eyebrow">Data science · Visualization, lesson 2</p><h1 style="font-size:116px;line-height:1">Chart families</h1><p style="font-size:38px;line-height:1.35;margin:0;color:#c8d4e3;max-width:1200px">Every chart belongs to a family, and every family answers one kind of question</p>
 <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:20px">${FAMS.map((f,i)=>`<span style="font-size:26px;padding:10px 20px;border:1px solid #3a4a60;border-radius:999px;color:#dfe7f2"><span style="font-family:var(--f-mono);color:#8fb0ff">${i+1}</span>&nbsp; ${f.name}</span>`).join('')}</div></div>`,
 notes:'Lesson 1 started from column types. This lesson starts from the question. Students will learn to hear a question, recognize its family from a few signal words, and pick the default chart of that family.'},
{id:'l2-overview',deck:1,sec:'Chart families',html:`<div class="head"><p class="eyebrow">Six questions, six families</p><h2>Which kind of question are you asking?</h2></div>
 <div class="fam6">${FAMS.map((f,i)=>`<button data-go="${f.id}"><span class="k">${i+1} · start with: ${f.dflt.toLowerCase()}</span><b>${f.name}</b><span class="q">${f.q}</span><span class="w">${f.words}</span></button>`).join('')}</div>`,
 notes:'Read each core question aloud and ask for an example from the students\' own work or courses. Click a card to jump to that family. The grey words at the bottom are signal words: words in a question that point to its family.'},
fam({id:'l2-cmp',n:1,draw:'f_cmp',state:{kind:'bar'},title:'Comparison: which is bigger?',kinds:[['bar','Bar'],['sorted','Sorted bar'],['dot','Dot / dumbbell'],['grouped','Grouped bar']],
 qs:['Which penguin species is heaviest?','Which of our sales regions grew the most this year?','Which model has the best accuracy on the test set?'],not:'how values are spread within a group (use distribution charts) or change over many time points (use a line).',
 kn:{bar:'<b>Bar chart</b> · the default: one value per group, from a zero baseline.',sorted:'<b>Sorted bar</b> · turns a comparison into a ranking. Horizontal bars fit long labels.',dot:'<b>Dot / dumbbell</b> · two values per group (female vs male, before vs after) and the gap between them.',grouped:'<b>Grouped bar</b> · subgroups inside each group. Gets crowded beyond 2–3 subgroups.'},
 notes:'Comparison questions ask which is bigger or how groups rank. Click through the four charts: the same means, different emphasis. Sorted bars answer "which is the heaviest group?" fastest; the dumbbell answers "how big is the male–female gap in each species?"'}),
fam({id:'l2-dist',n:2,draw:'f_dist',state:{kind:'hist'},title:'Distribution: what is typical, how spread out?',kinds:[['hist','Histogram'],['kde','Density'],['box','Box plot'],['ecdf','ECDF']],
 qs:['What is a typical flipper length, and how much do penguins vary?','How long do most customers wait for delivery?','Are there outliers in the transaction amounts?'],not:'comparing a single number per group (use comparison) or a link between two measurements (use relationship).',
 kn:{hist:'<b>Histogram</b> · the default for one numeric column: peaks, spread, gaps.',kde:'<b>Density curves</b> · compare the shape of a few groups without bins.',box:'<b>Box plot</b> · compare median and spread across many groups compactly.',ecdf:'<b>ECDF</b> · answer threshold questions directly: what share is at or below 200 mm?'},
 notes:'Distribution questions are about the whole range of values, not one summary number. Each chart answers a slightly different version: the histogram shows the shape, the box plot compares groups, and the ECDF answers "what share falls below a threshold?"'}),
fam({id:'l2-rel',n:3,draw:'f_rel',state:{kind:'scatter'},title:'Relationship: do two things move together?',kinds:[['scatter','Scatter'],['trend','Scatter + trend'],['hex','Hexbin'],['corr','Correlation heatmap']],
 qs:['Do penguins with longer flippers weigh more?','Does advertising spend predict sales?','Which features are related to the target before we model?'],not:'categories on one of the axes (use comparison or distribution charts) or proving that one thing causes another.',
 kn:{scatter:'<b>Scatter plot</b> · the default: form, direction, strength and outliers.',trend:'<b>Scatter + trend line</b> · states the direction and the size of the effect.',hex:'<b>Hexbin</b> · the same question for thousands or millions of points.',corr:'<b>Correlation heatmap</b> · screens many pairs at once. Follow up with scatter plots.'},
 notes:'Relationship questions need two numeric columns. The trend line puts a number on it: about how many grams per extra millimetre of flipper. Remind students that a strong relationship is not evidence of cause.'}),
fam({id:'l2-comp',n:4,draw:'f_comp',state:{kind:'stack100'},title:'Composition: what is the whole made of?',kinds:[['stack100','100% stacked'],['stacked','Stacked counts'],['pie','Pie'],['waffle','Waffle']],
 qs:['Which species make up each island\'s population?','What share of revenue comes from each product line?','How has the mix of traffic sources changed since last year?'],not:'precise comparison of the parts themselves (use a sorted bar chart) or many tiny parts.',
 kn:{stack100:'<b>100% stacked bar</b> · compares the mix across groups or periods.',stacked:'<b>Stacked counts</b> · shows the totals and their parts together.',pie:'<b>Pie</b> · acceptable for one whole with 2–3 clearly different parts, like this one.',waffle:'<b>Waffle</b> · each square is 1%: easy for general audiences to read.'},
 notes:'Composition questions contain "share", "percent of", "breakdown" or "mix". If the question compares the parts\' sizes precisely, it is really a comparison question and a sorted bar chart is better.'}),
fam({id:'l2-time',n:5,draw:'f_time',state:{kind:'line'},title:'Change over time: rising, falling, when?',kinds:[['line','Line'],['area','Area'],['slope','Slope (start vs end)'],['log','Log scale']],
 qs:['Which penguin colonies are growing, and which are shrinking?','Did sign-ups change after the new website launched?','Is there a seasonal pattern in monthly sales?'],not:'categories without a natural order, or just one moment in time.',
 kn:{line:'<b>Line chart</b> · the default: trends, turning points, crossings.',area:'<b>Area chart</b> · one series where the size of the total matters. Always from zero.',slope:'<b>Slope chart</b> · only the start and the end: a clear before/after story that hides the path.',log:'<b>Log scale</b> · compares growth rates: equal slopes mean equal % growth.'},
 notes:'Time questions use words like trend, since, growth, before and after. The line chart is the default. The slope chart answers "how much did each change overall?" but hides everything in between.'}),
fam({id:'l2-grp',n:6,draw:'f_grp',state:{kind:'ignore'},title:'Groups: does the pattern hold everywhere?',kinds:[['ignore','Ignore groups'],['hue','Color by group'],['facets','Small multiples']],
 qs:['Is the bill length–depth link the same for every species?','Is our model equally accurate for each customer segment?','Does the price–size relationship differ between cities?'],not:'a single overall answer when groups don\'t matter. But check first: hidden groups can reverse a trend.',
 kn:{ignore:'<b>Ignoring groups</b> · longer bills look shallower overall (r is negative).',hue:'<b>Color by group</b> · one chart, a line per group: every species trends up.',facets:'<b>Small multiples</b> · one panel per group: clearest with 3+ groups or overlapping points.'},
 notes:'This family adds a grouping to any other family. The penguins show why it matters: ignoring species gives the wrong sign. Simpson\'s paradox again, this time framed as a question type.'}),
{id:'l2-step',deck:1,sec:'Chart families',html:`<div class="head"><p class="eyebrow">Choosing within a family</p><h2>Start with the default, step up when you need to</h2></div>
 <div style="background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 20px"><table class="t" style="font-size:25px"><tr><th style="width:18%">Family</th><th style="width:20%">Start with</th><th style="width:34%">Step up when…</th><th>Use instead</th></tr>
 ${[['Comparison','Sorted bar chart','each group has two values (before/after)','Dot / dumbbell'],['Distribution','Histogram','you compare several groups, or need percentiles','Box, violin or strip · ECDF'],['Relationship','Scatter plot','there are thousands of points, or many columns','Hexbin · pair plot · heatmap'],['Composition','100% stacked bar','there are many parts or a hierarchy','Treemap · pie only for 2–3 parts'],['Change over time','Line chart','you have few periods, two moments, or growth rates','Columns · slope chart · log scale'],['Groups','Color by group','there are more than ~3 groups, or points overlap','Small multiples']].map(r=>`<tr><td style="font-weight:600">${r[0]}</td><td>${r[1]}</td><td style="color:var(--muted)">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>`,
 notes:'The default chart in each family answers most questions. Step up only when the default fails for a specific reason listed here. This keeps students from reaching for exotic charts first.'},
{id:'l2-sort',deck:1,sec:'Practice',special:'sorter',html:`<div class="head"><p class="eyebrow">Practice</p><h2>Which family is this question?</h2></div>
 <div class="sorter"><div class="sq"><p class="eyebrow" id="sq-n" style="color:var(--muted)"></p><p class="qtext" id="sq-q"></p><div class="sbtns" id="sq-b">${FAMS.map((f,i)=>`<button data-f="${i}">${f.name}</button>`).join('')}</div></div>
 <div style="display:flex;flex-direction:column;gap:22px"><p class="sfeed" id="sq-f">Pick a family. Listen for the signal words.</p><div class="card"><p class="big" id="sq-s" style="font-size:72px;color:var(--ink);line-height:1">0 / 0</p><p>correct so far</p></div><div style="display:flex;gap:14px"><button class="btn" id="sq-next">Next question</button><button class="btn ghost" id="sq-reset">Start over</button></div></div></div>`,
 notes:'Twelve questions from different fields. Let students vote before clicking. Some could fit two families, for example a mix that changes over time; discuss which word decides it.'},
{id:'l2-ds',deck:1,sec:'Chart families at work',draw:'f_ds',state:{kind:'eda'},special:'ds',html:`<div class="head"><p class="eyebrow">The same families, data science jobs</p><h2>Charts at each step of a project</h2></div>
 <div class="steps4" id="ds-steps"><div data-st="0"><b>1 · Understand the data</b>Distribution</div><div data-st="1"><b>2 · Explore</b>Relationship · Groups</div><div data-st="2"><b>3 · Check the model</b>Relationship · Comparison</div><div data-st="3"><b>4 · Communicate</b>Comparison · Change · Composition</div></div>
 <div class="body" style="grid-template-columns:1060px 1fr"><div class="chartcol"><canvas class="ch" data-w="1060" data-h="520"></canvas><div class="ctrls">${seg({k:'kind',lbl:'Chart'},[['eda','Histograms'],['explore','Pair plot'],['resid','Residuals'],['cm','Confusion matrix'],['imp','Feature importance']])}</div></div>
 <div class="side"><p data-kindnote style="margin:0;font-size:26px;line-height:1.45"></p></div></div>`,
 kn:{eda:'<b>Understand · distribution family.</b> A histogram of every numeric column is the first thing to make with a new dataset. Question: what values, ranges and oddities are in here?',explore:'<b>Explore · relationship + groups.</b> A pair plot colored by species. Question: which columns move together, and do groups separate?',resid:'<b>Check the model · relationship family.</b> Residuals (errors) against predictions. Question: are the errors random? Here they cluster by species, so the model is missing the species column.',cm:'<b>Check the model · comparison in a heatmap.</b> Counts of actual vs predicted classes. Question: which classes does the classifier confuse? Mostly Chinstrap predicted as Adelie (outlined).',imp:'<b>Communicate · comparison family.</b> A sorted bar chart of feature importance. Question: which inputs matter most to the model?'},
 notes:'Data scientists use the same six families throughout a project, just with different data: raw columns early on, model outputs later. Residual plots and confusion matrices look specialized, but they are a scatter plot and a heatmap answering ordinary relationship and comparison questions.'},
{id:'l2-recap',deck:1,sec:'Chart families',html:`<div class="head"><p class="eyebrow">Recap</p><h2>Hear the question, name the family, start with the default</h2></div>
 <div style="background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 20px"><table class="t" style="font-size:25px"><tr><th style="width:20%">Family</th><th style="width:38%">The question</th><th style="width:22%">Signal words</th><th>Start with</th></tr>${FAMS.map(f=>`<tr><td style="font-weight:600">${f.name}</td><td>${f.q}</td><td style="font-family:var(--f-mono);font-size:19px;color:var(--muted)">${f.words.split(' · ').slice(0,3).join(' · ')}</td><td>${f.dflt}</td></tr>`).join('')}</table></div>
 <div style="display:flex;gap:16px"><button class="btn" data-go="map">Lesson 1: the chart map</button><a class="btn ghost" href="https://claude.ai/artifact/ULtmfSMhs3cFY7RQecu7rM" target="_blank" rel="noopener" style="text-decoration:none">Open Chart Chooser</a></div>`,
 notes:'Two routes to the same chart: Lesson 1 starts from the column types, Lesson 2 from the question. In practice students should check both: the question picks the family, the column types confirm it.'}
];
const KN={};S2.forEach(s=>{if(s.kn)KN[s.id]=s.kn;});
function initSorter(el){let order=[],k=0,right=0,done=0;const shuffle=()=>{const r=rng(Date.now()%100000);order=SORTQ.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]];}k=0;right=0;done=0;show();};
 const btns=[...el.querySelectorAll('#sq-b button')];
 const show=()=>{const q=SORTQ[order[k]];el.querySelector('#sq-n').textContent=`Question ${k+1} of ${SORTQ.length}`;el.querySelector('#sq-q').textContent=q[0];btns.forEach(b=>{b.disabled=false;b.className='';});el.querySelector('#sq-f').textContent='Pick a family. Listen for the signal words.';el.querySelector('#sq-s').textContent=`${right} / ${done}`;};
 btns.forEach(b=>b.addEventListener('click',()=>{const q=SORTQ[order[k]],pick=+b.dataset.f;done++;if(pick===q[1])right++;btns.forEach(x=>{x.disabled=true;if(+x.dataset.f===q[1])x.className='right';else if(x===b)x.className='wrong';});
  el.querySelector('#sq-f').innerHTML=(pick===q[1]?'<b style="color:var(--good)">Right.</b> ':'<b style="color:var(--bad)">Not quite.</b> ')+SORTWHY[q[1]];el.querySelector('#sq-s').textContent=`${right} / ${done}`;}));
 el.querySelector('#sq-next').addEventListener('click',()=>{if(k<SORTQ.length-1){k++;show();}else{el.querySelector('#sq-f').innerHTML=`<b>Done: ${right} of ${done} correct.</b> Press Start over for a new order.`;}});
 el.querySelector('#sq-reset').addEventListener('click',shuffle);order=SORTQ.map((_,i)=>i);show();}
S.forEach(s=>{s.deck=s.deck||0;});S.push(...S2);

/* ---------- engine ---------- */
let SCALE=1,cur=0;const stage=$('#stage');
const ST=S.map(s=>JSON.parse(JSON.stringify(s.state||{})));
const build=()=>S.forEach((s,i)=>{const el=document.createElement('section');el.className='slide'+(s.dark?' dark':'');el.id='sl-'+s.id;el.hidden=true;el.setAttribute('aria-label',`Slide ${i+1}`);el.innerHTML=typeof s.html==='function'?s.html():s.html;stage.appendChild(el);s.el=el;bind(i);});
function drawSlide(i){const s=S[i];if(!s.draw)return;const cv=s.el.querySelector('canvas.ch:not(#mapcv)');if(cv)paint(cv,D[s.draw],ST[i]);syncCtrls(i);}
function paint(cv,fn,st){const w=+cv.dataset.w,h=+cv.dataset.h,k=SCALE*(window.devicePixelRatio||1);cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));const ctx=cv.getContext('2d');ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,w,h);try{fn(ctx,w,h,st);}catch(e){console.error(e);}}
function syncCtrls(i){const s=S[i],st=ST[i];s.el.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(el.tagName==='BUTTON')el.setAttribute('aria-pressed',String(st[k])===el.dataset.v);else if(el.type==='checkbox')el.checked=!!st[k];else if(el.type==='range'){el.value=st[k];const o=s.el.querySelector(`[data-o="${k}"]`);if(o)o.textContent=st[k];}});
 const pre=s.el.querySelector('[data-code]');if(pre&&s.code)pre.textContent=CODE[s.code](st);
 if(s.special==='fix'){const left=['zero','color','labels','title','points'].filter(k=>!st[k]).length;$('#fixleft').innerHTML=left?`<b>${left} problem${left>1?'s':''} left.</b> Each one makes the chart harder to read or easier to misread.`:'<b style="color:var(--good)">Fixed.</b> Same data, now honest and readable.';}
 const tg=s.el.querySelector('[data-toggle]');if(tg)tg.textContent=st.show?'Hide the plots':'Reveal the plots';
 if(KN[s.id]){const kn=s.el.querySelector('[data-kindnote]');if(kn)kn.innerHTML=KN[s.id][st.kind]||'';}
 if(s.special==='ds'){const stg={eda:0,explore:1,resid:2,cm:2,imp:3}[st.kind];s.el.querySelectorAll('#ds-steps div').forEach(d=>d.classList.toggle('on',+d.dataset.st===stg));}}
function bind(i){const s=S[i],st=ST[i],el=s.el;
 el.querySelectorAll('[data-k]').forEach(c=>{const k=c.dataset.k;const ev=c.tagName==='BUTTON'?'click':c.type==='range'?'input':'change';c.addEventListener(ev,()=>{if(c.tagName==='BUTTON')st[k]=c.dataset.v;else if(c.type==='checkbox')st[k]=c.checked;else st[k]=+c.value;drawSlide(i);});});
 el.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{st[b.dataset.toggle]=!st[b.dataset.toggle];drawSlide(i);}));
 el.querySelectorAll('[data-reveal]').forEach(b=>b.addEventListener('click',()=>{const a=b.parentElement.querySelector('.ans');a.hidden=!a.hidden;b.textContent=a.hidden?'Reveal an answer':'Hide the answer';}));
 el.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(S.findIndex(x=>x.id===b.dataset.go))));
 if(s.special==='map')initMap(el);if(s.special==='prompt')initPrompt(el);if(s.special==='sorter')initSorter(el);}
/* chart map */
const MAP=[['One numeric column','histogram','c-hist','hist',{bins:20,split:false},'See the spread of one number. Then try a box plot.'],['One categorical column','bar chart','c-bar','bar',{sort:true,horiz:false,color:false},'Count rows per group: sns.countplot().'],['Numeric + categorical','box / violin','c-groups','groups',{kind:'points'},'Compare groups with box, violin or strip plots. Bars of means only with error bars.'],['Two numeric columns','scatter plot','c-scatter','scatter',{color:true,fit:'species'},'Look for a relationship. Add a trend line; color by group.'],['Time + numeric','line chart','c-line','line',{kind:'line'},'Follow change over time. Lines join what belongs together.'],['Parts of a total','stacked bar','c-parts','parts',{kind:'stack100'},'Show the mix. Pies only for one whole with 2–3 parts.'],['Many numeric columns','pair plot, heatmap','c-pair','pair',{hue:true,corner:true},'Get an overview before modeling.'],['Any of these × groups','small multiples','c-facets','facets',{shared:true},'Repeat the same chart per group to see if a pattern holds.']];
let mapSel=3;function initMap(el){const L=el.querySelector('#maplist');L.innerHTML=MAP.map((m,i)=>`<button data-m="${i}"><span>${m[0]}</span><span class="r">→ ${m[1]}</span></button>`).join('');L.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{mapSel=+b.dataset.m;drawMap();}));el.querySelector('#mapgo').addEventListener('click',()=>go(S.findIndex(x=>x.id===MAP[mapSel][2])));}
function drawMap(){const m=MAP[mapSel];$('#maplist').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===mapSel));paint($('#mapcv'),D[m[3]],m[4]);$('#mapwhy').textContent=m[5];$('#mapgo').textContent=`Go to the ${m[1].split(/[ ,/]/)[0]} slide →`;}
/* prompt builder */
const PQ=[{q:'Do Gentoo penguins weigh more than the other species?',cols:'species (categorical), body_mass_g (numeric, grams)',chart:'a box plot with the individual penguins overlaid as a strip plot',enc:'species on the x-axis, body_mass_g on the y-axis, one color per species',fin:'label the y-axis "Body mass (g)", write a title that states the finding, use a colorblind-safe palette'},
 {q:'Are flipper length and body mass related?',cols:'flipper_length_mm (numeric), body_mass_g (numeric), species (categorical)',chart:'a scatter plot with one linear trend line per species',enc:'flipper_length_mm on x, body_mass_g on y, color by species',fin:'axis labels with units (mm, g), points at 60% opacity, label each species directly instead of a legend'},
 {q:'How are flipper lengths distributed?',cols:'flipper_length_mm (numeric), species (categorical)',chart:'a histogram, shown with 10, 20 and 40 bins side by side',enc:'flipper_length_mm on x; a second version colored by species',fin:'axis labels with units, a shared y-axis across the three panels, a title naming what you notice'}];
function initPrompt(el){const sel=el.querySelector('#pq');sel.innerHTML=PQ.map((p,i)=>`<option value="${i}">${p.q}</option>`).join('');const upd=()=>{const p=PQ[+sel.value];const parts=[p.cols,p.chart,p.enc,p.fin];const on=[0,1,2,3].map(i=>el.querySelector('#pp'+i).checked);parts.forEach((t,i)=>{const v=el.querySelector('#pv'+i);v.textContent=t;v.style.opacity=on[i]?1:.35;});
 const n=1+on.filter(Boolean).length;el.querySelector('#pmeter').innerHTML=`${[0,1,2,3,4].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}<span style="margin-left:8px">${n} of 5 parts</span>`;
 const lines=['I have a pandas DataFrame `penguins` (seaborn\'s penguins dataset).','Question: '+p.q];if(on[0])lines.push('Columns: '+p.cols+'.');if(on[1])lines.push('Chart: '+p.chart+'.');if(on[2])lines.push('Encodings: '+p.enc+'.');if(on[3])lines.push('Finishing: '+p.fin+'.');lines.push('Use seaborn and matplotlib, and explain any choice you make.');
 el.querySelector('#pout').textContent=n===1?'Make a chart of the penguins data that answers: '+p.q+'\n\n(Everything else, the AI decides for you.)':lines.join('\n');};
 sel.addEventListener('change',upd);[0,1,2,3].forEach(i=>el.querySelector('#pp'+i).addEventListener('change',upd));upd();}
/* navigation */
function fit(){const vp=$('#viewport');const vw=vp.clientWidth,vh=vp.clientHeight;SCALE=Math.max(.05,Math.min(vw/1920,vh/1080));stage.style.transform=`translate(${(vw-1920*SCALE)/2}px,${(vh-1080*SCALE)/2}px) scale(${SCALE})`;redraw();}
function redraw(){drawSlide(cur);if(S[cur].special==='map')drawMap();}
const deckIdx=d=>S.map((_,i)=>i).filter(i=>S[i].deck===d);const lastIn=[0,S.findIndex(s=>s.deck===1)];
function step(d){const ids=deckIdx(S[cur].deck);const k=ids.indexOf(cur)+d;if(k>=0&&k<ids.length)go(ids[k]);}
function go(i,noHash){if(i<0||i>=S.length)return;S[cur].el.hidden=true;S[cur].el.classList.remove('enter');cur=i;const s=S[cur];lastIn[s.deck]=cur;s.el.hidden=false;s.el.classList.add('enter');const ids=deckIdx(s.deck),k=ids.indexOf(cur);
 $('#b-num').textContent=`${k+1} / ${ids.length}`;$('#b-sec').textContent=s.sec;$('#b-prev').disabled=k===0;$('#b-next').disabled=k===ids.length-1;$('#prog').style.width=((k+1)/ids.length*100)+'%';$('#notes').innerHTML=`<b>Speaker notes · ${s.deck?'Chart families':'Seeing Data'} · slide ${k+1}</b>${s.notes||''}`;
 document.querySelectorAll('#bar .decks button').forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.deck===s.deck)));
 if(!noHash){try{history.replaceState(null,'','#'+(s.deck?'families':'slide')+'-'+(k+1));}catch(e){}}redraw();}
document.querySelectorAll('#bar .decks button').forEach(b=>b.addEventListener('click',()=>go(lastIn[+b.dataset.deck])));
$('#b-prev').addEventListener('click',()=>step(-1));$('#b-next').addEventListener('click',()=>step(1));
const toggleNotes=()=>{const on=!document.body.classList.contains('notes');document.body.classList.toggle('notes',on);$('#notes').hidden=!on;$('#b-notes').setAttribute('aria-pressed',on);fit();};
$('#b-notes').addEventListener('click',toggleNotes);
$('#b-full').addEventListener('click',()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}catch(e){}});
document.addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&t!=='BUTTON')){e.preventDefault();step(1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1);}else if(e.key==='Home')go(deckIdx(S[cur].deck)[0]);else if(e.key==='End'){const ids=deckIdx(S[cur].deck);go(ids[ids.length-1]);}else if(e.key==='n'||e.key==='N')toggleNotes();});
let tx=null;$('#viewport').addEventListener('touchstart',e=>{const t=e.target.tagName;tx=(t==='INPUT'||t==='SELECT')?null:e.touches[0].clientX;},{passive:true});$('#viewport').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)step(dx<0?1:-1);tx=null;},{passive:true});
let rt;new ResizeObserver(()=>{cancelAnimationFrame(rt);rt=requestAnimationFrame(fit);}).observe($('#viewport'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
build();const m=(location.hash||'').match(/^#(slide|families)-(\d+)$/);if(m){const ids=deckIdx(m[1]==='families'?1:0);go(ids[Math.max(0,Math.min(ids.length,+m[2])-1)],true);}else go(0,true);fit();
})();
</script>
